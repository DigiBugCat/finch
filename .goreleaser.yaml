# GoReleaser config for the finch agent.
#
# The agent is a Go module under agent/ (not the repo root), so the build runs
# with `dir: agent`. On a tag push the release workflow cross-compiles every
# target (darwin/linux × amd64/arm64, plus linux armv6/armv7 for 32-bit Pis) and
# uploads RAW binaries named exactly `finch-<os>-<arch>` to GitHub
# Releases — which is what the installer (`$HUB/releases/finch-${os}-${arch}`)
# and the worker /releases redirect resolve to.
#
#   tag v1.4.0  ->  stamps -X .../agent/core.agentVersion=1.4.0 (matches the literal
#                   scripts/check-versions.mjs keeps in sync across all three files)
version: 2

project_name: finch

builds:
  - id: finch
    dir: agent
    main: .
    binary: finch
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64
      - arm
    # 32-bit ARM variants: armv6 covers the Pi Zero / Pi 1 (uname -m = armv6l),
    # armv7 covers the Pi 2 / Pi 3 in 32-bit mode (armv7l). 64-bit Pis use arm64.
    goarm:
      - "6"
      - "7"
    ignore:
      # No 32-bit ARM macOS target exists.
      - goos: darwin
        goarch: arm
    ldflags:
      - -s -w -X github.com/digibugcat/finch/agent/core.agentVersion={{ .Version }}

archives:
  # Serve un-tarred binaries named exactly finch-<os>-<arch> so the installer's
  # URL and the worker /releases redirect download a runnable binary directly.
  - id: raw
    formats: [binary]
    # `.Arm` is set only for goarch=arm (6/7), so 32-bit builds become
    # finch-linux-armv6 / finch-linux-armv7 while amd64/arm64 keep their plain
    # finch-<os>-<arch> names. The installer maps uname -m (armv6l/armv7l) to these.
    name_template: "finch-{{ .Os }}-{{ .Arch }}{{ if .Arm }}v{{ .Arm }}{{ end }}"

checksum:
  name_template: "checksums.txt"
  algorithm: sha256

release:
  draft: false
  prerelease: auto
  name_template: "finch {{ .Version }}"
  # Release notes open with how to get this version, then GoReleaser's grouped
  # commit list (below). The human-written summary lives in CHANGELOG.md.
  header: |
    ## Install or update

    ```sh
    curl -fsSL https://finchmcp.com/install | sh
    ```

    Already have finch? Run `finch update`. Binaries for macOS and Linux are
    attached below; verify them against `checksums.txt`.

    What changed, in plain words: see
    [CHANGELOG.md](https://github.com/DigiBugCat/finch/blob/{{ .Tag }}/CHANGELOG.md).
  footer: |
    ---
    Running your own hub? Redeploy it from `{{ .Tag }}`; see
    [docs/self-host.md](https://github.com/DigiBugCat/finch/blob/{{ .Tag }}/docs/self-host.md).
    **Full diff:** https://github.com/DigiBugCat/finch/compare/{{ .PreviousTag }}...{{ .Tag }}

# Commit messages here are plain sentences ("Fix …", "Make …"), not
# conventional-commit prefixes, so groups match on the leading verb and on a
# few keywords. Groups are checked in order; the first match wins. Each entry
# may start with its short SHA, which the optional prefix in the anchored
# patterns skips.
changelog:
  use: github
  sort: asc
  abbrev: 7
  filters:
    exclude:
      - "(?i)^(?:[0-9a-f]{7,40}:? )?merge "
      - "(?i)^(?:[0-9a-f]{7,40}:? )?promote"
      - "(?i)^(?:[0-9a-f]{7,40}:? )?bump "
      - "(?i)^(?:[0-9a-f]{7,40}:? )?pin .*staging"
  groups:
    - title: Security
      regexp: '(?i)(security|vulnerab|privilege|revocation|fail closed|^(?:[0-9a-f]{7,40}:? )?harden)'
      order: 0
    - title: New
      regexp: '(?i)^(?:[0-9a-f]{7,40}:? )?(add|introduce|support|speak)\b'
      order: 1
    - title: Fixes
      regexp: '(?i)^(?:[0-9a-f]{7,40}:? )?(fix|correct|stop|restore|keep|repair|resolve)\b'
      order: 2
    - title: Removed
      regexp: '(?i)^(?:[0-9a-f]{7,40}:? )?(remove|cut|drop|delete|wipe|untrack)\b'
      order: 3
    - title: Documentation
      regexp: '(?i)^(?:[0-9a-f]{7,40}:? )?(document|docs?\b|readme|changelog|refine .*\bdocs\b|publish .*\bguide\b|make .*\bguide\b)'
      order: 4
    - title: Other changes
      order: 999
