name: Bug report
description: Something in finch does not work the way it should.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Found a security problem? Please don't file it here; see SECURITY.md.
        Never paste a `finch_` key, a CLI token or the contents of `~/.finch/`.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you ran or did, what you expected, and what you got instead. Paste the exact output or error.
      placeholder: |
        I ran `finch add notes --service http://127.0.0.1:8000` and expected ..., but got ...
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ...
        2. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: finch version
      description: Output of `finch version`.
      placeholder: finch 1.8.0
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Machine
      options:
        - macOS (Apple silicon)
        - macOS (Intel)
        - Linux (amd64)
        - Linux (arm64)
        - Linux (32-bit ARM, such as a Raspberry Pi)
    validations:
      required: true
  - type: dropdown
    id: hub
    attributes:
      label: Hub
      options:
        - finchmcp.com
        - A hub I run myself
    validations:
      required: true
  - type: input
    id: client
    attributes:
      label: MCP client or local server, if relevant
      placeholder: Claude Code 2.x talking to a FastMCP 3.x server
  - type: textarea
    id: status
    attributes:
      label: finch status --json
      description: Optional. Remove anything you consider private.
      render: json
