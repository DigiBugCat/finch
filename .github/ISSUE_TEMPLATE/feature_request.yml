name: Feature request
description: Suggest something finch should do.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The task or situation, in your own words. What gets in the way today?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help
      description: The command, flag or behaviour you have in mind, if you have one.
  - type: textarea
    id: workaround
    attributes:
      label: What you do instead today
